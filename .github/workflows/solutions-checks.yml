name: Solution admin and migration checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'database/**'
      - 'tests/**'
      - 'composer.*'
      - '.github/workflows/solutions-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solutions-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dvtec_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_TESTING_HTTP: 'false'
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:BTWIi6nuqFGlT81VxZmmap2bkut6MZp2/6ZZddnBAbU=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: dvtec_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CURATOR_GLIDE_TOKEN: dvtec-test-glide-token
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: gd, imagick, mbstring, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies
        run: |
          cp .env.example .env
          mkdir -p test-results
          composer install --prefer-dist --no-interaction --no-progress
      - name: Test fresh schema, existing-data upgrade and rollback on MySQL
        run: |
          test "$DB_DATABASE" = dvtec_testing
          php artisan migrate --force
          vendor/bin/phpunit tests/Integration/SolutionMigrationTest.php --log-junit test-results/solution-migrations.xml 2>&1 | tee test-results/solution-migrations.log
      - name: Prepare isolated HTTP test database
        run: |
          # DatabaseMigrations rolls back tables; the legacy settings migration has no down().
          # Reset only this disposable CI database before booting the HTTP test suite.
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = dvtec_testing
          php artisan migrate:fresh --force
          php artisan db:seed --force
          php artisan view:cache
          php artisan view:clear
      - name: Run solution admin and public-visibility regressions
        env:
          APP_TESTING_HTTP: 'true'
        run: vendor/bin/phpunit --filter 'Solution(Admin|CategoryAdmin|Feature)Test|ContentNavigationTest' --log-junit test-results/solution-admin.xml 2>&1 | tee test-results/solution-admin.log
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build assets for the complete PHP suite
        run: |
          npm install --global pnpm@10.15.0
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: Run complete PHP unit and feature suite
        env:
          APP_TESTING_HTTP: 'true'
        run: vendor/bin/phpunit --log-junit test-results/full-phpunit.xml 2>&1 | tee test-results/full-phpunit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: solution-verification
          path: test-results/
          retention-days: 7
